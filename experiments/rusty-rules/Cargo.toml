[package]
name = "rusty-rules-experiment"
version = "0.1.1"
edition = "2024"
description = "Experimental JSON rules engine with bounded execution and a persistent worker protocol"
license = "BSD-3-Clause"
repository = "https://github.com/elite-libs/rules-machine"
readme = "CRATE_README.md"
keywords = ["rules", "rules-engine", "json", "interpreter"]
categories = ["parsing", "command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "CRATE_README.md", "LICENSE.md"]

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
