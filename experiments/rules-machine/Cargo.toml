[package]
name = "rules-machine"
version = "0.1.1"
edition = "2024"
description = "JSON-serializable rules engine: experimental Rust subset of Rules Machine"
license = "BSD-3-Clause"
repository = "https://github.com/elite-libs/rules-machine"
readme = "README.md"
keywords = ["rules", "rules-engine", "json", "interpreter"]
categories = ["parsing"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md"]

[dependencies]
rules-machine-core = { package = "rusty-rules-experiment", version = "=0.1.1" }

[dev-dependencies]
serde_json = "1.0"
